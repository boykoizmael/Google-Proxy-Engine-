<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1117 Search</title>
  
  <!-- 1. Load Fuse.js for powerful client-side search algorithms -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
  
  <style>
    /* 2. Style the 1117 Search Engine */
    :root {
      --bg: #ffffff;
      --text: #202124;
      --primary: #1a73e8;
      --border: #dfe1e5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15vh;
      margin: 0;
    }
    .brand {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 30px;
    }
    .brand span:nth-child(1) { color: #4285f4; }
    .brand span:nth-child(2) { color: #ea4335; }
    .brand span:nth-child(3) { color: #fbbc05; }
    .brand span:nth-child(4) { color: #34a853; }
    
    .search-container {
      width: 100%;
      max-width: 584px;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .search-box {
      width: 100%;
      padding: 14px 24px;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      box-shadow: 0 1px 6px rgba(32,33,36,0.1);
      transition: box-shadow 0.2s, border 0.2s;
    }
    .search-box:focus {
      box-shadow: 0 1px 8px rgba(32,33,36,0.2);
      border-color: rgba(223,225,229,0);
    }
    
    #results {
      margin-top: 40px;
      width: 100%;
      max-width: 650px;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .result-item {
      margin-bottom: 25px;
    }
    .result-title {
      color: var(--primary);
      font-size: 1.25rem;
      text-decoration: none;
      display: block;
      margin-bottom: 3px;
    }
    .result-title:hover {
      text-decoration: underline;
    }
    .result-url {
      color: #202124;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .result-desc {
      font-size: 0.9rem;
      color: #4d5156;
      line-height: 1.58;
    }
    .no-results {
      color: #5f6368;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- The 1117 Logo -->
  <div class="brand">
    <span>1</span><span>1</span><span>1</span><span>7</span>
  </div>
  
  <!-- The Search Input Box -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-box" placeholder="Search the 1117 database..." autocomplete="off">
  </div>

  <!-- Where results will appear -->
  <div id="results"></div>

  <script>
    // 3. Define the Database (Your Index)
    // You can add as many items here as you want.
    const database = [
      {
        title: "How to Build a Client-Side Search Engine",
        url: "https://1117.local/guides/client-search",
        description: "Learn how to use JavaScript and JSON to create an in-browser search engine that requires no backend database."
      },
      {
        title: "History of 1117",
        url: "https://1117.local/about",
        description: "The 1117 search engine was created as a fully contained, lightning-fast tool for looking up local data."
      },
      {
        title: "JavaScript Variables and Functions",
        url: "https://1117.local/code/js",
        description: "A deep dive into declaring variables, writing functions, and manipulating the DOM to build interactive web apps."
      },
      {
        title: "Designing Search Interfaces",
        url: "https://1117.local/design/ui",
        description: "Best practices for spacing, typography, and shadow effects when building a clean search engine homepage."
      }
    ];

    // 4. Configure the Search Engine Logic
    const fuseOptions = {
      keys: ['title', 'description'], // Tell the engine to look in both titles and descriptions
      includeScore: true,             // Rank the best matches at the top
      threshold: 0.3                  // Fuzziness level: 0.0 requires an exact match, 1.0 matches anything
    };
    
    // Initialize the engine with your database
    const engine = new Fuse(database, fuseOptions);

    // 5. Connect the User Interface to the Engine
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');

    searchInput.addEventListener('input', function(e) {
      const query = e.target.value;
      
      // If the search bar is empty, clear the results
      if (query.trim() === '') {
        resultsContainer.innerHTML = '';
        return;
      }

      // Ask the engine to find matches
      const results = engine.search(query);
      
      // Render the results to the page
      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results">Your search did not match any documents in 1117.</div>';
      } else {
        resultsContainer.innerHTML = results.map(result => {
          const item = result.item; // Extract the matched data
          return `
            <div class="result-item">
              <div class="result-url">${item.url}</div>
              <a href="${item.url}" class="result-title">${item.title}</a>
              <div class="result-desc">${item.description}</div>
            </div>
          `;
        }).join('');
      }
    });
  </script>
</body>
</html>
