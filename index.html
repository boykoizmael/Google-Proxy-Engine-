<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>1117 Search</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="1117 home">1117</a>
    <button id="menuButton" class="menu-button" aria-label="Open menu" aria-expanded="false">☰</button>

    <div id="menu" class="menu hidden">
      <button data-mode="search">🔎 Web Search</button>
      <button data-mode="website">🌐 Open Website</button>
      <button data-mode="weather">🌤️ Weather</button>
      <button data-mode="calculator">🧮 Calculator</button>
      <button data-mode="home">🏠 Home</button>
    </div>
  </header>

  <main id="homeView" class="view home-view">
    <section class="hero">
      <div class="logo">1117</div>
      <h1>Search the web. Stay in 1117.</h1>

      <form id="searchForm" class="search-box">
        <select id="modeSelect" aria-label="Search type">
          <option value="search">Web</option>
          <option value="website">Website</option>
          <option value="weather">Weather</option>
          <option value="calculator">Calc</option>
        </select>
        <input id="queryInput" type="text"
               placeholder="Search the web or enter a URL"
               autocomplete="off" spellcheck="false">
        <button type="submit">Search</button>
      </form>

      <div class="chips">
        <button data-fill="hi">Say hi</button>
        <button data-fill="weather Seattle">Weather</button>
        <button data-fill="2 + 2 * 10">Calculator</button>
        <button data-fill="https://example.com">Open website</button>
      </div>

      <p class="hint">
        Enter a normal search, ask for weather, calculate something, or paste a website address.
      </p>
    </section>
  </main>

  <main id="resultsView" class="view results-view hidden">
    <div class="results-toolbar">
      <button id="backHome" class="small-button">← Home</button>
      <form id="resultsSearchForm" class="results-search">
        <select id="resultsMode" aria-label="Search type">
          <option value="search">Web</option>
          <option value="website">Website</option>
          <option value="weather">Weather</option>
          <option value="calculator">Calc</option>
        </select>
        <input id="resultsQuery" type="text" autocomplete="off" spellcheck="false">
        <button type="submit">Search</button>
      </form>
    </div>
    <div id="status" class="status"></div>
    <div id="resultsList" class="results-list"></div>
  </main>

  <main id="browserView" class="view browser-view hidden">
    <div class="browser-toolbar">
      <button id="browserBack" class="small-button" title="Back">←</button>
      <button id="browserForward" class="small-button" title="Forward">→</button>
      <button id="browserReload" class="small-button" title="Reload">↻</button>

      <form id="urlForm" class="url-bar">
        <input id="urlInput" type="text" placeholder="https://example.com"
               autocomplete="off" spellcheck="false">
        <button type="submit">Go</button>
      </form>
    </div>

    <div id="frameNotice" class="notice hidden"></div>

    <iframe id="siteFrame"
      title="Website viewer"
      referrerpolicy="no-referrer"
      sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-same-origin allow-scripts">
    </iframe>
  </main>

  <footer>1117 Search</footer>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
