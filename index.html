<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowSearch Pro - Advanced Proxy Workspace</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-dark: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body, html { width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; }

        /* Left Hand Navigation Sidebar */
        aside {
            width: 320px; height: 100%; background: var(--panel-dark);
            border-right: 1px solid var(--border-color); display: flex;
            flex-direction: column; z-index: 20; transition: transform 0.3s;
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .logo-text { font-size: 1.3rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        
        .search-wrapper { padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] {
            flex-grow: 1; padding: 10px 14px; background: var(--bg-dark);
            border: 1px solid var(--border-color); border-radius: 8px; color: white;
            font-size: 0.9rem; outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        
        button {
            padding: 10px 16px; background: var(--accent); color: white; border: none;
            border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
        }
        button:hover { background: var(--accent-hover); }

        /* Menu Navigation Links & Tabs */
        .menu-tabs { display: flex; border-bottom: 1px solid var(--border-color); background: #161e2e; }
        .tab-btn {
            flex: 1; padding: 10px; background: transparent; color: var(--text-muted);
            border-radius: 0; font-weight: 500; font-size: 0.85rem; border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.02); color: white; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

        .content-panel { flex-grow: 1; overflow-y: auto; padding: 15px 20px; }
        .panel-section { display: none; }
        .panel-section.active { display: block; }

        /* Search Results Styles */
        .search-item {
            background: var(--bg-dark); padding: 12px; margin-bottom: 12px;
            border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer;
        }
        .search-item:hover { border-color: var(--accent); }
        .item-title { color: var(--accent); font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
        .item-url { color: var(--text-muted); font-size: 0.75rem; margin-bottom: 4px; word-break: break-all; }
        .item-desc { color: #d1d5db; font-size: 0.85rem; line-height: 1.4; }

        /* Fast Shortcut Hub Links */
        .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hub-card {
            background: var(--bg-dark); padding: 12px; text-align: center;
            border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s;
        }
        .hub-card:hover { border-color: var(--success); transform: translateY(-2px); }

        /* Dynamic Main View Window Shell */
        main { flex-grow: 1; height: 100%; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; background: white; }

        .status-pill {
            font-size: 0.75rem; background: #1e1b4b; color: #a5b4fc;
            padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Left hand Controller Panel Matrix -->
    <aside>
        <div class="sidebar-header">
            <div class="logo-text">SHADOWSEARCH PRO</div>
            <span class="status-pill" id="engine-status">Engine Connection: Active</span>
        </div>

        <div class="search-wrapper">
            <div class="input-group">
                <input type="text" id="omni-search" placeholder="Type query phrase or full URL...">
                <button onclick="dispatchQuery()">Launch</button>
            </div>
        </div>

        <!-- Interface Panel Navigation Tabs -->
        <div class="menu-tabs">
            <button class="tab-btn active" onclick="switchTab('search-tab')">Results</button>
            <button class="tab-btn" onclick="switchTab('hub-tab')">Shortcut Hub</button>
        </div>

        <div class="content-panel">
            <!-- Search Results Display Section Tab -->
            <div id="search-tab" class="panel-section active">
                <div id="results-target">
                    <p style="color: var(--text-muted); text-align: center; margin-top: 30px; font-size: 0.9rem;">
                        Submit a search phrase to aggregate proxied connections.
                    </p>
                </div>
            </div>

            <!-- Predefined Unblocked Quick Launcher List Tab -->
            <div id="hub-tab" class="panel-section">
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Fast-launch pre-optimized engines and apps inside the active proxy:</p>
                <div class="hub-grid">
                    <div class="hub-card" onclick="runDirect('https://google.com')">Google Sandbox</div>
                    <div class="hub-card" onclick="runDirect('https://youtube.com')">YouTube Player</div>
                    <div class="hub-card" onclick="runDirect('https://arras.io')">🎮 Arras.io Game</div>
                    <div class="hub-card" onclick="runDirect('https://diep.io')">🎮 Diep.io Game</div>
                    <div class="hub-card" onclick="runDirect('https://discord.com')">Discord Web</div>
                    <div class="hub-card" onclick="runDirect('https://github.com')">GitHub Code</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Isolated Interactive Render Plane -->
    <main>
        <iframe id="rendering-sandbox" src="about:blank" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
    </main>

    <script>
        // Setup internal tab view controllers
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel-section').forEach(sec => sec.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function stringToHex(str) {
            let hex = '';
            for (let i = 0; i < str.length; i++) {
                hex += str.charCodeAt(i).toString(16).padStart(2, '0');
            }
            return hex;
        }

        // Evaluate search context inputs vs absolute destination loops
        async function dispatchQuery() {
            const rawInput = document.getElementById('omni-search').value.trim();
            if (!rawInput) return;

            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;

            if (urlPattern.test(rawInput)) {
                let target = rawInput;
                if (!/^https?:\/\//i.test(rawInput)) target = 'https://' + rawInput;
                runDirect(target);
            } else {
                // If text input is a query phrase, invoke internal scraping compiler engine
                await runInternalSearchEngine(rawInput);
            }
        }

        function runDirect(url) {
            const iframe = document.getElementById('rendering-sandbox');
            const hex = stringToHex(url);
            iframe.src = window.location.origin + '/service/' + hex;
        }

        // Scrapes decentralized backend clusters and maps results onto sidebar list cards
        async function runInternalSearchEngine(phrase) {
            const targetPane = document.getElementById('results-target');
            targetPane.innerHTML = '<p style="text-align:center; color:var(--accent); font-size:0.9rem;">Fetching search index matches...</p>';
            switchTab('search-tab');

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: phrase })
                });
                const data = await res.json();
                
                renderCustomList(data.results);
            } catch (err) {
                targetPane.innerHTML = '<p style="text-align:center; color:#ef4444; font-size:0.9rem;">Search Index Cluster Timeout.</p>';
            }
        }

        function renderCustomList(items) {
            const pane = document.getElementById('results-target');
            pane.innerHTML = '';

            if(!items || items.length === 0) {
                pane.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.9rem;">No engine indexing records found.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'search-item';
                card.onclick = () => runDirect(item.url);
                card.innerHTML = `
                    <div class="item-title">${item.title}</div>
