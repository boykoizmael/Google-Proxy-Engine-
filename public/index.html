<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>1117 Search</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111827'/%3E%3Ctext x='50' y='67' text-anchor='middle' font-size='52' fill='white' font-family='Arial,sans-serif' font-weight='700'%3E1117%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="1117 Search">1117</div>
    <div class="top-actions">
      <button id="menuButton" class="icon-button" aria-expanded="false" aria-controls="menu">☰</button>
    </div>

    <div id="menu" class="menu hidden">
      <button data-mode="search">🔎 Web Search</button>
      <button data-mode="website">🌐 Open Website</button>
      <button data-mode="weather">🌤️ Weather</button>
      <button data-mode="calculator">🧮 Calculator</button>
      <button data-mode="home">🏠 1117 Home</button>
    </div>
  </header>

  <main id="homeView" class="home-view">
    <section class="hero">
      <div class="logo-large">1117</div>
      <p class="tagline">Search the web. Stay in 1117.</p>

      <form id="searchForm" class="search-box" autocomplete="off">
        <select id="modeSelect" aria-label="Search mode">
          <option value="search">Web</option>
          <option value="website">Website</option>
          <option value="weather">Weather</option>
          <option value="calculator">Calc</option>
        </select>
        <input
          id="queryInput"
          type="text"
          placeholder="Search the web or enter a website URL"
          spellcheck="false"
          aria-label="Search"
        />
        <button type="submit" title="Search">↵</button>
      </form>

      <div id="quickMenu" class="quick-menu">
        <button data-fill="weather Seattle">Weather</button>
        <button data-fill="2 + 2 * 10">Calculator</button>
        <button data-fill="https://example.com">Open a website</button>
      </div>

      <div id="homeMessage" class="home-message">
        Try <b>hi</b>, <b>what's today's weather in Seattle?</b>, a normal search, or a full URL.
      </div>
    </section>
  </main>

  <section id="resultsView" class="results-view hidden">
    <div class="results-header">
      <button id="backHome" class="secondary-button">← Home</button>
      <form id="resultsSearchForm" class="results-search-form">
        <select id="resultsMode" aria-label="Search mode">
          <option value="search">Web</option>
          <option value="website">Website</option>
          <option value="weather">Weather</option>
          <option value="calculator">Calc</option>
        </select>
        <input id="resultsQuery" type="text" spellcheck="false" aria-label="Search" />
        <button type="submit">Search</button>
      </form>
    </div>

    <div id="resultStatus" class="status"></div>
    <div id="resultsList" class="results-list"></div>
  </section>

  <section id="browserView" class="browser-view hidden">
    <div class="browser-toolbar">
      <button id="browserBack" class="secondary-button">←</button>
      <button id="browserForward" class="secondary-button">→</button>
      <button id="browserReload" class="secondary-button">↻</button>
      <form id="urlForm" class="url-form">
        <input id="urlInput" type="url" placeholder="https://example.com" spellcheck="false" />
        <button type="submit">Go</button>
      </form>
    </div>
    <div id="frameNotice" class="frame-notice hidden"></div>
    <iframe
      id="siteFrame"
      title="1117 in-page website viewer"
      referrerpolicy="no-referrer"
      sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-presentation allow-same-origin allow-scripts"
    ></iframe>
  </section>

  <footer>
    1117 Search · Built as a custom search interface
  </footer>

  <script src="/app.js"></script>
</body>
</html>
